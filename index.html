<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Unity WebAR ArUco</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #unity-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
    #unity-canvas{width:100%;height:100%;background:#000}
    #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;z-index:10}
    #loading.hidden{display:none}
  </style>
</head>
<body>
  <div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading">Loading Unity WebAR...</div>
  <script async src="https://docs.opencv.org/4.13.0/opencv.js"></script>
  <script>
    window.cvReady = false;
    var Module = {
      onRuntimeInitialized: function(){ window.cvReady = true; console.log('OpenCV.js ready'); }
    };
  </script>
  <script src="Build/web.loader.js"></script>
  <script>
    var canvas = document.querySelector('#unity-canvas');
    var config = {
      dataUrl: 'Build/web.data.unityweb',
      frameworkUrl: 'Build/web.framework.js.unityweb',
      codeUrl: 'Build/web.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'WebAR',
      productName: 'Unity WebAR ArUco',
      productVersion: '1.0'
    };
    createUnityInstance(canvas, config, function(progress){
      document.getElementById('loading').textContent = 'Loading Unity ' + Math.round(progress*100) + '%';
    }).then(function(unityInstance){
      document.getElementById('loading').classList.add('hidden');
      window.unityInstance = unityInstance;
    }).catch(function(message){
      document.getElementById('loading').textContent = message;
      console.error(message);
    });
  </script>
</body>
</html>
